<head>

<title>Simulador de precio · LiciPy</title>

<style>
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --ink:#14233A; --muted:#5A6778; --line:#D6DCE4;
  --brand:#0F2E5A; --accent:#E8952B; --accent-ink:#8A5208; --track:#E3E8EF;
  --loss:#C2463D; --loss-soft:#F6DCD9; --win:#2D7A55; --band:#C9D7EA;
  --display:"Archivo",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1622; --panel:#16212F; --ink:#E5EAF1; --muted:#9AA7B8; --line:#2B3848;
  --brand:#8FB3E6; --accent:#F0A84A; --accent-ink:#F5C27E; --track:#243142;
  --loss:#E8786F; --loss-soft:#3A2324; --win:#63C292; --band:#2E4566; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1622; --panel:#16212F; --ink:#E5EAF1; --muted:#9AA7B8; --line:#2B3848;
  --brand:#8FB3E6; --accent:#F0A84A; --accent-ink:#F5C27E; --track:#243142;
  --loss:#E8786F; --loss-soft:#3A2324; --win:#63C292; --band:#2E4566; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:18px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;border-bottom:3px solid var(--accent);padding-bottom:10px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;color:var(--brand);letter-spacing:-.01em}
.logo span{color:var(--accent)}
.tag{color:var(--muted);font-size:13px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);line-height:1.15;margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);max-width:66ch}
.motto{margin:8px 0 0;font-style:italic;color:var(--accent-ink);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);margin-top:8px}
.meta b{color:var(--ink);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 4px}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px;max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:6px}
.inputs label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.inputs input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.metaRow{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 0}
.metaRow .big{font-family:var(--display);font-size:34px;font-weight:800;color:var(--accent-ink)}
.metaRow span{font-size:13px;color:var(--muted)}
.ruler{position:relative;height:150px;margin:6px 6px 0}
.track{position:absolute;left:0;right:0;top:70px;height:8px;border-radius:4px;background:var(--track)}
.loss{position:absolute;top:64px;height:20px;left:0;background:var(--loss-soft);border-right:2px solid var(--loss);border-radius:4px 0 0 4px}
.lossTxt{position:absolute;top:88px;font-size:11px;color:var(--loss);white-space:nowrap;transform:translateX(-100%);padding-right:4px}
.comp{position:absolute;top:30px;width:2px;height:48px;background:var(--brand);transform:translateX(-1px);opacity:.85}
.comp i{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--ink);background:var(--panel);padding:0 3px;white-space:nowrap;border-radius:3px}
.comp.low i{bottom:auto;top:52px}
.comp.r{background:transparent;border-left:2px dashed var(--brand)}
.ruler input[type=range]{position:absolute;left:-9px;right:-9px;width:calc(100% + 18px);top:56px;height:36px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.ruler input::-webkit-slider-runnable-track{height:36px;background:transparent}
.ruler input::-moz-range-track{height:36px;background:transparent}
.ruler input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:34px;border-radius:5px;background:var(--accent);border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab}
.ruler input::-moz-range-thumb{width:16px;height:32px;border-radius:5px;background:var(--accent);border:2px solid var(--panel);cursor:grab}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:0 6px;font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.l1::before{background:var(--accent)} .l2::before{background:var(--brand);width:2px!important} .l3::before{background:var(--loss-soft);border:1px solid var(--loss)} .l4::before{background:var(--band)}
.bands{display:grid;gap:6px;margin-top:14px}
.band{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center;font-size:12px}
.band .lab{color:var(--muted)}
.band .bt{position:relative;height:14px;background:var(--track);border-radius:3px}
.band .bf{position:absolute;top:0;bottom:0;background:var(--band);border-radius:3px}
.band .bm{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--brand);border-radius:2px;transform:translateX(-1.5px)}
.band.on .lab{color:var(--ink);font-weight:600}
.res{display:grid;gap:12px}
.kpi{border-bottom:1px solid var(--line);padding-bottom:10px}
.kpi:last-child{border-bottom:none}
.kpi span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--display);font-size:24px;font-weight:700}
.kpi small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pos{color:var(--win)} .neg{color:var(--loss)}
.verdict{font-size:14px;line-height:1.45}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.pill.ok{background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win)}
.pill.warn{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink)}
.pill.bad{background:var(--loss-soft);color:var(--loss)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
th{background:var(--brand);color:var(--panel);text-align:left;padding:8px 10px;font-weight:600}
td{padding:7px 10px;border-top:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:12.5px}
#comps td.n,#comps td:first-child{white-space:nowrap} #comps small{color:var(--muted)}
tr.under td.d{color:var(--win)} tr.over td.d{color:var(--loss)}
.notes{font-size:12.5px;color:var(--muted);display:grid;gap:6px;max-width:80ch}
.notes p{margin:0}
.close{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(async function(){
const VENCE=Date.parse(document.querySelector('meta[name="licipy-vence"]').content);
const carga=document.getElementById("cargando");
function aviso(t,x){document.getElementById("cargaTit").textContent=t;document.getElementById("cargaTxt").textContent=x;}
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0));
const clave=location.hash.slice(1);
if(Date.now()>=VENCE&&!clave){aviso("Este simulador venció","Para su próximo llamado, pida un simulador nuevo con datos actualizados de la DNCP.");return;}
if(!clave){aviso("Enlace incompleto","Abra el enlace completo que le enviamos, sin recortarlo.");return;}
let P;
try{
  const raw=b64(document.getElementById("cifrado").textContent.trim());
  const k=await crypto.subtle.importKey("raw",b64(clave),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},k,raw.slice(12));
  P=JSON.parse(new TextDecoder().decode(pt));
}catch(e){aviso("Enlace incompleto","Abra el enlace completo que le enviamos, sin recortarlo.");return;}
carga.insertAdjacentHTML("afterend",P.html);carga.remove();document.title=P.titulo;
const D=P.datos;
if(Date.now()>=VENCE){document.getElementById("live").remove();document.getElementById("expired").hidden=false;return;}
const MONTO=D.monto, MIN=D.escala[0], MAX=D.escala[1], IVA=D.iva_divisor||1.1;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pos=m=>Math.min(100,Math.max(0,(m-MIN)/(MAX-MIN)*100));
const pct=v=>(v*100).toLocaleString("es-PY",{maximumFractionDigits:1})+" %";
const gs=v=>(v<0?"−":"")+"Gs. "+Math.round(Math.abs(v)).toLocaleString("es-PY");
const gsM=v=>(v<0?"−":"")+"Gs. "+(Math.abs(v)/1e6).toLocaleString("es-PY",{maximumFractionDigits:1})+" M";

$("costo").value=D.inicial.costo; $("fijos").value=D.inicial.fijos; $("ofer").value=D.inicial.oferentes;
const r=$("meta"); r.min=MIN; r.max=MAX; r.value=D.inicial.meta;
const sc=$("scale"); for(let v=Math.round(MIN*10);v<=Math.round(MAX*10);v++){const s=document.createElement("span");s.textContent=(v*10)+" %";sc.appendChild(s);}

const ruler=$("ruler");
D.comparables.forEach(c=>{const d=document.createElement("div");d.className="comp"+(c.fila===1?" low":"")+(c.fila===2?" r":"");d.style.left=pos(c.pct)+"%";
  d.innerHTML=`<i>${esc(c.nombre)} ${pct(c.pct)}</i>`;if(c.fila===2){d.querySelector("i").style.bottom="64px";}ruler.insertBefore(d,r);});

const bh=$("bands");
D.bandas.forEach((b,k)=>{const e=document.createElement("div");e.className="band";e.id="b"+k;
  e.innerHTML=`<div class="lab">${esc(b.etiqueta)}</div><div class="bt"><div class="bf" style="left:${pos(b.lo)}%;width:${Math.max(1.2,pos(b.hi)-pos(b.lo))}%"></div><div class="bm" style="left:${pos(b.med)}%"></div></div>`;bh.appendChild(e);});
if(D.bandas_nota){const bt=document.createElement("p");bt.className="hint";bt.style.margin="2px 0 0";bt.textContent=D.bandas_nota;bh.appendChild(bt);}

const fdmy=f=>f?f.slice(8,10)+"/"+f.slice(5,7)+"/"+f.slice(0,4):"";
const C=D.competidores||[];
if(!C.length){$("compSec").remove();}
else{$("comps").innerHTML=C.map(c=>{
  const rango=Math.abs(c.max-c.min)<5e-4?pct(c.min):`${pct(c.min)} – ${pct(c.max)}`;
  const det=c.adjudicaciones&&c.adjudicaciones.length?c.adjudicaciones.map(a=>`${fdmy(a.fecha)}: ${pct(a.pct)}`).join("<br>"):"más de 6: ver rango";
  const fuera=c.fuera?`<br><small>${c.fuera} más fuera del 60–150 % del referencial, no cuentan</small>`:"";
  return `<tr><td>${esc(c.nombre)}</td><td class="n">${c.n} ${c.n===1?"vez":"veces"}</td><td class="n">${rango}</td><td class="n">${fdmy(c.ultima_fecha)} · ${pct(c.ultima_pct)}</td><td>${det}${fuera}</td></tr>`}).join("");}
function band(n){for(let i=0;i<D.bandas.length;i++){const h=D.bandas[i].hasta;if(h==null||n<=h)return i;}return D.bandas.length-1;}
function update(){
  const m=+r.value, c=Math.max(0,+$("costo").value||0)/100, F=Math.max(0,+$("fijos").value||0), n=Math.max(1,+$("ofer").value||1);
  $("metaTxt").textContent=pct(m);
  const neto=MONTO/IVA, G=neto*(1-c/m)-F, eq=c/(1-F/neto);
  const lw=pos(Math.min(MAX,eq));$("loss").style.width=lw+"%";
  $("lossTxt").style.left=lw+"%";$("lossTxt").textContent=eq>MIN?"equilibrio "+pct(eq):"";
  $("gan").textContent=gsM(G);$("gan").className=G>=0?"pos":"neg";
  $("ganSub").textContent="si se factura el máximo de "+gsM(MONTO);
  $("mar").textContent=pct(G/neto);$("mar").className=G>=0?"":"neg";
  const k=band(n);D.bandas.forEach((b,i)=>$("b"+i).classList.toggle("on",i===k));
  const B=D.bandas[k], above=D.comparables.filter(x=>m>x.pct+1e-4).map(x=>esc(x.nombre));
  const of=`${n} oferente${n>1?"s":""}`;
  let pill,msg;
  if(G<0){pill='<span class="pill bad">Pierde plata</span>';msg=`A ${pct(m)} no cubre su costo. Su piso es ${pct(eq)}: por debajo de eso, cada trabajo le cuesta.`;}
  else if(m>B.hi+1e-4){pill='<span class="pill warn">Arriba del rango</span>';msg=`Con ${of}, esta convocante adjudicó entre ${pct(B.lo)} y ${pct(B.hi)}. Su meta queda por encima: es probable que otro precio gane.`;}
  else if(m<B.lo-1e-4){pill='<span class="pill warn">Más bajo de lo necesario</span>';msg=`Con ${of} se adjudicó desde ${pct(B.lo)}. Está dejando margen sobre la mesa; revise si el pliego le pedirá justificar el precio.`;}
  else {pill='<span class="pill ok">Dentro del rango ganador</span>';msg=`Con ${of}, esta convocante adjudicó entre ${pct(B.lo)} y ${pct(B.hi)}. Su meta está adentro y le deja ${pct(G/neto)} de margen.`;}
  const pos2=above.length?`<br><small>Queda por encima de: ${above.join(", ")}.</small>`:`<br><small>Queda por debajo de todos los competidores marcados.</small>`;
  $("verd").innerHTML=pill+"<br>"+msg+pos2;
  $("items").innerHTML=D.items.map(it=>{const p=Math.round(it.referencial*m),df=p/it.a_batir-1;
    return `<tr class="${df<=0.0005?'under':'over'}"><td>${esc(it.descripcion)}</td><td>${esc(it.unidad)}</td><td class="n">${gs(it.referencial)}</td><td class="n">${gs(it.a_batir)}</td><td class="n">${gs(p)}</td><td class="n d">${df>0?"+":""}${(df*100).toLocaleString("es-PY",{maximumFractionDigits:1})} %</td></tr>`}).join("");
}
["meta","costo","fijos","ofer"].forEach(id=>$(id).addEventListener("input",update));
update();
})();
</script>
</body>
</html>
