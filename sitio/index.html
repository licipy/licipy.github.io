<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>LiciPy</title>
<style>
:root{--bg:#F2F4F7;--ink:#14233A;--muted:#5A6778;--brand:#0F2E5A;--accent:#E8952B;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1622;--ink:#E5EAF1;--muted:#9AA7B8;--brand:#8FB3E6;--accent:#F0A84A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1622;--ink:#E5EAF1;--muted:#9AA7B8;--brand:#8FB3E6;--accent:#F0A84A;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
.logo{font-weight:800;font-size:26px;color:var(--brand);border-bottom:3px solid var(--accent);padding-bottom:8px}
.logo span{color:var(--accent)}
p{color:var(--muted)}
</style>
</head>
<body><main><div class="logo">Lici<span>Py</span></div><p>Potenciamos sus licitaciones con inteligencia.</p></main></body>
</html>
